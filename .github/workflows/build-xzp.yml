name: Build Aurora XZP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Create XZP package
        run: |
          mkdir -p output
          zip -r output/SneezerRay.xzp . \
            -x ".git/*" \
            -x ".github/*" \
            -x "output/*"

      - name: Upload XZP
        uses: actions/upload-artifact@v4
        with:
          name: SneezerRay-Aurora-XZP
          path: output/SneezerRay.xzp
